<!doctype html>
<html lang="en">
  <body style="margin:0;background:#F7F9FC;color:#0B1220;font-family:Inter,Arial,sans-serif;line-height:1.6;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ subject }}</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F7F9FC;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;background:#FFFFFF;border:1px solid #E3E8F1;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="background:#06122B;padding:28px 32px;">
                <div style="font-family:Arial,sans-serif;font-size:24px;font-weight:700;color:#FFFFFF;letter-spacing:-.3px;">Vendari</div>
                <div style="margin-top:6px;color:#BFD2FF;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;">Business made clearer</div>
              </td>
            </tr>
            <tr>
              <td style="padding:36px 32px 28px;">
                <p style="margin:0 0 8px;color:#4683EC;font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;">Vendari Support Team</p>
                <h1 style="margin:0 0 20px;color:#06122B;font-family:Arial,sans-serif;font-size:28px;line-height:1.2;">{{ subject }}</h1>
                <div style="color:#4B5768;font-size:16px;white-space:pre-line;">{{ message }}</div>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px;background:#F7F9FC;border-top:1px solid #E3E8F1;color:#8792A2;font-size:12px;">
                You received this message from Vendari Support Team because you have an account with Vendari.<br>
                support@vendari.name.ng
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
